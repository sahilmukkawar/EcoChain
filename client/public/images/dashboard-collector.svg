<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-hidden="true" focusable="false">
  <title>Waste collection routes</title>
  <circle cx="252" cy="54" r="50" fill="#dcfce7" opacity="0.55"/>
  <circle cx="104" cy="60" r="19" fill="#fde047" opacity="0.4"/>
  <ellipse cx="160" cy="171" rx="116" ry="13" fill="#bbf7d0" opacity="0.65"/>

  <!-- route dashes -->
  <path d="M40 158c40-14 74 6 112-6s60-30 96-22" stroke="#86efac" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="9 9"/>

  <!-- truck body -->
  <rect x="96" y="92" width="92" height="46" rx="7" fill="#22c55e"/>
  <rect x="96" y="92" width="92" height="14" rx="7" fill="#16a34a"/>
  <!-- cab -->
  <path d="M188 104h26l20 22v12h-46z" fill="#15803d"/>
  <path d="M194 110h16l13 15h-29z" fill="#bbf7d0"/>
  <!-- bumper -->
  <rect x="92" y="134" width="150" height="8" rx="4" fill="#166534"/>

  <!-- recycle mark -->
  <g fill="#f0fdf4" transform="translate(126 104) scale(0.72)">
    <path d="M18 0l10 17H8z"/>
    <path d="M33 30l-16 9 10 17 8-4-5-9 9-5z"/>
    <path d="M3 30l16 9-10 17-8-4 5-9-9-5z"/>
  </g>

  <!-- wheels -->
  <circle cx="124" cy="146" r="15" fill="#374151"/>
  <circle cx="124" cy="146" r="6.5" fill="#9ca3af"/>
  <circle cx="214" cy="146" r="15" fill="#374151"/>
  <circle cx="214" cy="146" r="6.5" fill="#9ca3af"/>

  <!-- pickup bin -->
  <path d="M52 120h34l-4 38a7 7 0 0 1-7 6H63a7 7 0 0 1-7-6z" fill="#4ade80"/>
  <rect x="48" y="112" width="42" height="10" rx="5" fill="#16a34a"/>

  <!-- location pin -->
  <path d="M262 58c9 0 16 7 16 16 0 12-16 26-16 26s-16-14-16-26c0-9 7-16 16-16z" fill="#ef4444"/>
  <circle cx="262" cy="74" r="6" fill="#fff"/>
</svg>
