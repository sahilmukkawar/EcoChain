<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-hidden="true" focusable="false">
  <title>Sustainable production</title>
  <circle cx="250" cy="56" r="50" fill="#dcfce7" opacity="0.55"/>
  <circle cx="92" cy="62" r="18" fill="#fde047" opacity="0.4"/>
  <ellipse cx="160" cy="171" rx="114" ry="13" fill="#bbf7d0" opacity="0.65"/>

  <!-- leaves rising from the chimneys instead of smoke -->
  <g opacity="0.9">
    <path d="M118 54c11-5 20-1 23 8-11 4-20 0-23-8z" fill="#86efac"/>
    <path d="M150 34c9-4 17-1 19 7-9 3-17 0-19-7z" fill="#bbf7d0"/>
    <path d="M176 50c8-3 15-1 17 6-8 3-15 0-17-6z" fill="#86efac"/>
  </g>

  <!-- chimneys -->
  <rect x="112" y="72" width="18" height="34" rx="3" fill="#15803d"/>
  <rect x="164" y="64" width="18" height="42" rx="3" fill="#15803d"/>

  <!-- main building -->
  <path d="M84 106h152v52H84z" fill="#22c55e"/>
  <path d="M160 106h76v52h-76z" fill="#16a34a"/>
  <!-- saw-tooth roof -->
  <path d="M84 106l20-18 20 18zM124 106l20-18 20 18zM164 106l20-18 20 18zM204 106l20-18 20 18z" fill="#166534"/>

  <!-- windows -->
  <g fill="#f0fdf4" opacity="0.92">
    <rect x="98" y="120" width="18" height="14" rx="2.5"/>
    <rect x="126" y="120" width="18" height="14" rx="2.5"/>
    <rect x="182" y="120" width="18" height="14" rx="2.5"/>
    <rect x="210" y="120" width="18" height="14" rx="2.5"/>
  </g>
  <rect x="150" y="128" width="22" height="30" rx="3" fill="#dcfce7"/>

  <!-- base -->
  <rect x="78" y="156" width="164" height="8" rx="4" fill="#166534"/>

  <!-- gear -->
  <g transform="translate(258 124)">
    <circle r="19" fill="#facc15"/>
    <circle r="8" fill="#fff"/>
    <g fill="#facc15">
      <rect x="-3.5" y="-25" width="7" height="8" rx="2"/>
      <rect x="-3.5" y="17" width="7" height="8" rx="2"/>
      <rect x="-25" y="-3.5" width="8" height="7" rx="2"/>
      <rect x="17" y="-3.5" width="8" height="7" rx="2"/>
    </g>
  </g>

  <!-- material crate -->
  <rect x="48" y="132" width="30" height="26" rx="3" fill="#4ade80"/>
  <path d="M48 142h30" stroke="#166534" stroke-width="2.5"/>
</svg>
